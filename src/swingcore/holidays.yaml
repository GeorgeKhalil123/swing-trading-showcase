# TOY CALENDAR. Full-day NYSE closures for the years below, typed by hand; no early closes.
# The private system asks pandas_market_calendars instead. This file exists so the showcase has no
# calendar dependency, and `swingcore.trading_day_guard` refuses (exit 255) any year it does not list.
years: [2025, 2026, 2027]
holidays:
  - 2025-01-01  # New Year's Day
  - 2025-01-09  # national day of mourning
  - 2025-01-20  # Martin Luther King Jr. Day
  - 2025-02-17  # Washington's Birthday
  - 2025-04-18  # Good Friday
  - 2025-05-26  # Memorial Day
  - 2025-06-19  # Juneteenth
  - 2025-07-04  # Independence Day
  - 2025-09-01  # Labor Day
  - 2025-11-27  # Thanksgiving
  - 2025-12-25  # Christmas Day
  - 2026-01-01  # New Year's Day
  - 2026-01-19  # Martin Luther King Jr. Day
  - 2026-02-16  # Washington's Birthday
  - 2026-04-03  # Good Friday
  - 2026-05-25  # Memorial Day
  - 2026-06-19  # Juneteenth
  - 2026-07-03  # Independence Day, observed on the Friday
  - 2026-09-07  # Labor Day
  - 2026-11-26  # Thanksgiving
  - 2026-12-25  # Christmas Day
  - 2027-01-01  # New Year's Day
  - 2027-01-18  # Martin Luther King Jr. Day
  - 2027-02-15  # Washington's Birthday
  - 2027-03-26  # Good Friday
  - 2027-05-31  # Memorial Day
  - 2027-06-18  # Juneteenth, observed on the Friday
  - 2027-07-05  # Independence Day, observed on the Monday
  - 2027-09-06  # Labor Day
  - 2027-11-25  # Thanksgiving
  - 2027-12-24  # Christmas Day, observed on the Friday
