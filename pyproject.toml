[project]
name = "swingcore"
version = "0.1.0"
description = "Extracted core of a swing-trading research system: bitemporal cache, run manifest, schema-validated LLM runtime."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "George Khalil" }]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "pandas-stubs", "types-PyYAML", "types-jsonschema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swingcore"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
ignore_missing_imports = true
mypy_path = "src"
packages = ["swingcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
